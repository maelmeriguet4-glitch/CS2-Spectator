name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name CS2-Spectator
          --collect-all customtkinter --collect-all demoparser2 --collect-all pyarrow
          --hidden-import watchdog --hidden-import pyperclip --hidden-import sklearn
          --hidden-import joblib --hidden-import pandas --hidden-import numpy
          --hidden-import PIL --hidden-import darkdetect
          --add-data "cerveau_vac_cs2cd.pkl;."
          --add-data "src;src"
          main.py

      - name: Package Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\CS2-Spectator.exe -DestinationPath dist\CS2-Spectator-windows.zip

      - name: Build Linux executable
        if: runner.os == 'Linux'
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name CS2-Spectator
          --collect-all customtkinter --collect-all demoparser2 --collect-all pyarrow
          --hidden-import watchdog --hidden-import pyperclip --hidden-import sklearn
          --hidden-import joblib --hidden-import pandas --hidden-import numpy
          --hidden-import PIL --hidden-import darkdetect
          --add-data "cerveau_vac_cs2cd.pkl:."
          --add-data "src:src"
          main.py

      - name: Package Linux releases
        if: runner.os == 'Linux'
        run: |
          chmod +x dist/CS2-Spectator
          cd dist
          zip CS2-Spectator-linux.zip CS2-Spectator
          tar -czf CS2-Spectator-linux.tar.gz CS2-Spectator

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: |
            dist/CS2-Spectator.exe
            dist/CS2-Spectator-windows.zip
            dist/CS2-Spectator-linux.zip
            dist/CS2-Spectator-linux.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "CS2 Spectator $GITHUB_REF_NAME" \
            --generate-notes
