name: Release Pipeline

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag of the existing GitHub release to replace assets for"
        required: true
        default: "v2.5.2"
        type: string

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy
      - name: Run Release Gate (Strict)
        run: |
          python scripts/verify_release_ready.py --with-demo --with-build
      - name: Upload validated build
        uses: actions/upload-artifact@v4
        with:
          name: CS2_AntiCheat
          path: dist/CS2_AntiCheat.exe
          if-no-files-found: error

  publish:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: CS2_AntiCheat
          path: release-assets
      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: release-assets/CS2_AntiCheat.exe
          overwrite_files: true
          fail_on_unmatched_files: true
